<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="../assets/svg/favicon.svg">
	<link rel="stylesheet" href="../css/global.css">
	<link rel="stylesheet" href="../css/navbar.css">
	<title>Contact</title>
</head>
<body>
  <header>
    <section id=navSection>
      <a href="https://cleangreensllc.com/"><img src="../assets/logos/clean_greens.svg" alt="Clean Greens Logo" class="cg-logo-img"></a>
      <nav>
        <ul>
          <li><a href="services.html">Services</a></li>
          <li><a href="how_it_works.html">How it Works</a></li>
          <li><a href="about_us.html">About Us</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>

      <img src="../assets/svg/bars.svg" alt="navlinks toggle" class="nav-toggle-bars">
    </section>
  </header>

  <main>
    <h1>Hello!</h1>
    <p>Nice to meet you, we will reach you back soon</p>
    <section class="company-info">
      <div>
        <h3>Denver, CO.</h3>
      </div>
      <div>
        <p>+1 303-956-6673</p>
        <p>+1 720-635-1858</p>
      </div>
    </section>

    <form id="contact-form" action="http://localhost:3000/contact" method="post">
      <div>
        <label for="name">Name</label>
        <input name="name" placeholder="John Smith">
      </div>

      <div>
        <label for="email">E-mail</label>
        <input name="email" placeholder="info@example.com">
      </div>

      <div>
        <label for="subject">Subject</label>
        <input name="subject" placeholder="How can we help you? :)">
      </div>

      <div>
        <label for="message">Message</label>
        <textarea name="message" placeholder="Write your message here, please"></textarea>
      </div>

      <div>
        <button type="submit">Submit</button>
      </div>
    </form>
  </main>
<script src="../js/nav_toggle.js"></script>
</body>
</html>
